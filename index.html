<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ RAHMAD PRATAMA MIX - DS CEWEK</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;display:flex;justify-content:center;align-items:center;padding:6px;font-family:system-ui}
.card{width:100%;max-width:390px;background:linear-gradient(180deg,#0a0a0a,#000);border:2px solid #ff0000;border-radius:16px;padding:10px;box-shadow:0 0 30px #ff000055}
h1{margin:0;text-align:center;color:#ff0000;text-shadow:0 0 12px #ff0000;font-size:22px}
.sub{text-align:center;color:#888;font-size:9px;letter-spacing:3px;margin:4px 0 6px}
.photo-wrap{position:relative;width:100%;height:340px;border-radius:12px;overflow:hidden;border:2px solid #ff0000;background:#000}
.photo-wrap .bg-blur{position:absolute;inset:0;background:url('foto-rahmad.jpg') center/cover;filter:blur(20px) brightness(0.3)}
.photo-wrap img{position:relative;width:100%;height:100%;object-fit:contain;z-index:1}
input,textarea{width:100%;padding:10px;background:#0a0a0a;border:1px solid #ff0000;border-radius:8px;color:#fff;font-size:13px;margin:5px 0;outline:none}
textarea{height:72px;resize:none}
label{font-size:10px;color:#888;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:#ff0000}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctrl{background:#111;border:1px solid #2a0000;border-radius:8px;padding:6px}
.preset{display:flex;gap:4px;margin:6px 0}
.preset button{flex:1;padding:7px;font-size:8px;border-radius:6px;border:1px solid #ff0000;background:#000;color:#ff0000;font-weight:700}
.preset button.active{background:#ff0000;color:#000;box-shadow:0 0 10px #ff0000}
button.main{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:12px;margin-top:6px}
.blackred{background:linear-gradient(#ff0000,#8b0000);color:#fff}
.darkred{background:#1a0000;color:#ff0000;border:1.5px solid #ff0000}
#out{background:#050000;border:1px solid #330000;border-radius:8px;padding:8px;margin-top:6px;text-align:center;font-size:11px;color:#ff0000;min-height:36px}
</style>
</head>
<body>
<div class="card">
<h1>DJ RAHMAD<br>PRATAMA MIX</h1>
<div class="sub">• MC CEWEK DS ONTHEMIX STYLE •</div>
<div class="photo-wrap"><div class="bg-blur"></div><img src="foto-rahmad.jpg"></div>

<input type="text" id="nama" value="Papa Elbay_AND_Yonz">
<textarea id="kata">Special request, Papa Elbay_AND_Yonz, aku dan perasaan ini, DJ Rahmad Pratama Mix, new 2026!</textarea>

<div class="preset">
<button id="pDs" class="active" onclick="setPreset('ds')">CEWEK DS ORIGINAL 🔥</button>
<button id="pBar" onclick="setPreset('bar')">CEWEK BARBAR</button>
<button id="pEng" onclick="setPreset('eng')">ENGLISH FUNKOT</button>
</div>

<div class="ctrls">
<div class="ctrl"><label>Speed <span id="rv">1.10</span></label><input type="range" id="rate" min="0.8" max="1.5" step="0.05" value="1.10" oninput="rv.innerText=this.value"></div>
<div class="ctrl"><label>Cempreng <span id="pv">1.40</span></label><input type="range" id="pitch" min="1.0" max="1.8" step="0.05" value="1.40" oninput="pv.innerText=this.value"></div>
</div>

<button class="main blackred" onclick="playMC()">🎙️ PLAY - SPECIAL REQUEST</button>
<button class="main darkred" onclick="playMCFunkot()">🔥 PLAY + DROP FUNKOT</button>
<div id="out">DJ DS ONTHEMIX STYLE - READY!</div>
</div>

<script>
function setPreset(t){
 document.querySelectorAll('.preset button').forEach(b=>b.classList.remove('active'));
 if(t=='ds'){pDs.classList.add('active'); rate.value=1.10; pitch.value=1.40; kata.value="Special request, "+nama.value+", aku dan perasaan ini, DJ Rahmad Pratama Mix, new 2026!";}
 if(t=='bar'){pBar.classList.add('active'); rate.value=1.30; pitch.value=1.55; kata.value="Yo "+nama.value+"! Special request! DJ Rahmad Pratama Mix!";}
 if(t=='eng'){pEng.classList.add('active'); rate.value=1.15; pitch.value=1.35; kata.value="Special request, "+nama.value+", this is DJ Rahmad Pratama Mix!";}
 rv.innerText=rate.value; pv.innerText=pitch.value;
}
function playMC(){
 let kataText=document.getElementById('kata').value.trim();
 document.getElementById('out').innerHTML=`<b style="color:#fff">${kataText.toUpperCase()}</b>`;
 speechSynthesis.cancel();
 let msg=new SpeechSynthesisUtterance(kataText);
 msg.lang='en-US'; // PAKE ENGLISH BIAR "SPECIAL REQUEST" NYA MIRIP DJ DS!
 msg.rate=parseFloat(rate.value); 
 msg.pitch=parseFloat(pitch.value);
 msg.volume=1;
 let voices=speechSynthesis.getVoices();
 let female = voices.find(v=>v.name.toLowerCase().includes('female') && v.lang.includes('en'))
           || voices.find(v=>v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('karen') || v.name.toLowerCase().includes('female'))
           || voices.find(v=>v.lang=='en-US')
           || voices[1] || voices[0];
 if(female) msg.voice=female;
 speechSynthesis.speak(msg);
 // echo dobel khas funkot
 setTimeout(()=>{
  let msg2=new SpeechSynthesisUtterance(nama.value);
  msg2.lang='en-US'; msg2.rate=msg.rate*0.9; msg2.pitch=msg.pitch; msg2.volume=0.4;
  if(female) msg2.voice=female;
  speechSynthesis.speak(msg2);
 },700);
}
function playMCFunkot(){
 playMC();
 setTimeout(()=>{
  let ctx=new(window.AudioContext||window.webkitAudioContext)();
  function kick(a){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(160,a);o.frequency.exponentialRampToValueAtTime(30,a+0.3);g.gain.setValueAtTime(1.2,a);g.gain.exponentialRampToValueAtTime(0.01,a+0.6);o.connect(g);g.connect(ctx.destination);o.start(a);o.stop(a+0.7);}
  let t=ctx.currentTime+0.2; for(let i=0;i<32;i++) kick(t+i*(60/150));
 },3500);
}
speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices();};
</script>
</body>
</html>
