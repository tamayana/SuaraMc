<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DJ RAHMAD PRATAMA MIX</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;display:flex;justify-content:center;align-items:center;padding:8px;font-family:system-ui}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#0f0f0f,#000);border:2px solid #d4af37;border-radius:18px;padding:12px;box-shadow:0 0 25px #d4af3755}
h1{margin:0;text-align:center;color:#ff4da6;text-shadow:0 0 10px #ff4da6;font-size:22px;line-height:1;letter-spacing:1px}
.sub{text-align:center;color:#d4af37;font-size:9px;letter-spacing:3px;margin:4px 0 8px}
.photo{width:100%;height:135px;background:#000;border:1.5px solid #d4af37;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain}
input[type=text]{width:100%;padding:10px;background:#000;border:1px solid #d4af37;border-radius:8px;color:#fff;text-align:center;font-size:13px;margin:8px 0}
.ctrl{background:#111;border:1px solid #222;border-radius:8px;padding:6px 8px;margin:4px 0}
label{font-size:10px;color:#888;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:#ff4da6;height:14px}
.knobs{display:flex;gap:6px;margin:6px 0}
.knob{flex:1;background:linear-gradient(180deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:8px;padding:6px;text-align:center}
.knob span{font-size:9px;color:#d4af37;display:block}
.knob input{accent-color:#ff4da6}
.preset{display:flex;gap:4px;margin:6px 0}
.preset button{flex:1;padding:6px;font-size:9px;border-radius:6px;border:1px solid #d4af37;background:#000;color:#d4af37}
.preset button.active{background:#d4af37;color:#000}
button.main{width:100%;padding:11px;border:none;border-radius:10px;font-weight:900;font-size:12px;margin-top:6px}
.pink{background:linear-gradient(#ffb3d9,#ff4da6)}
.red{background:#ff0040;color:#fff}
#out{background:#000;border:1px solid #222;border-radius:8px;padding:8px;margin-top:6px;text-align:center;font-size:11px;color:#ff4da6;min-height:32px}
</style>
</head>
<body>
<div class="card">
<h1>DJ RAHMAD<br>PRATAMA MIX</h1>
<div class="sub">• MC CEWEK • LIVE •</div>

<div class="photo"><img src="foto-rahmad.jpg" alt="Rahmad"></div>

<input type="text" id="nama" value="Rahmad Pratama">

<div class="preset">
<button id="p1" class="active" onclick="setPreset('holy')">HOLYWINGS</button>
<button id="p2" onclick="setPreset('funkot')">FUNKOT</button>
<button id="p3" onclick="setPreset('break')">BREAKBEAT</button>
</div>

<div class="ctrl"><label>Kecepatan <span id="rv">0.85</span></label><input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85" oninput="rv.innerText=this.value"></div>
<div class="ctrl"><label>Manja / Pitch <span id="pv">1.20</span></label><input type="range" id="pitch" min="0.8" max="1.6" step="0.05" value="1.20" oninput="pv.innerText=this.value"></div>

<div class="knobs">
<div class="knob"><span>BASS</span><input type="range" id="bass" min="0" max="100" value="60"><span id="bv">60%</span></div>
<div class="knob"><span>MID</span><input type="range" id="mid" min="0" max="100" value="50"><span id="mv">50%</span></div>
<div class="knob"><span>TREBLE</span><input type="range" id="treb" min="0" max="100" value="70"><span id="tv">70%</span></div>
</div>

<button class="main pink" onclick="playMC()">🎙️ PLAY MC CEWEK</button>
<button class="main red" onclick="playMCFunkot()">🔥 PLAY + FUNKOT DROP</button>

<div id="out">Spesial request RAHMAD PRATAMA</div>
</div>

<script>
function setPreset(t){
 document.querySelectorAll('.preset button').forEach(b=>b.classList.remove('active'));
 if(t=='holy'){p1.classList.add('active'); rate.value=0.85; pitch.value=1.2; bass.value=60; mid.value=50; treb.value=70;}
 if(t=='funkot'){p2.classList.add('active'); rate.value=0.95; pitch.value=1.3; bass.value=80; mid.value=60; treb.value=75;}
 if(t=='break'){p3.classList.add('active'); rate.value=0.9; pitch.value=1.15; bass.value=70; mid.value=55; treb.value=80;}
 rv.innerText=rate.value; pv.innerText=pitch.value; bv.innerText=bass.value+'%'; mv.innerText=mid.value+'%'; tv.innerText=treb.value+'%';
}
bass.oninput=()=>bv.innerText=bass.value+'%'; mid.oninput=()=>mv.innerText=mid.value+'%'; treb.oninput=()=>tv.innerText=treb.value+'%';

let ctx=null;
function getCtx(){if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)(); return ctx;}

function playMC(){
 let name=document.getElementById('nama').value.trim()||'Rahmad Pratama';
 let rateV=parseFloat(document.getElementById('rate').value);
 let pitchV=parseFloat(document.getElementById('pitch').value);
 let bassV=parseInt(bass.value);
 document.getElementById('out').innerHTML=`🎙️ Spesial request<br><b style="color:#fff">${name.toUpperCase()}</b>`;
 speechSynthesis.cancel();
 let text=`Spesial request, ${name}, balee kancai kenak die, DJ Rahmad Pratama Mix!`;
 let msg=new SpeechSynthesisUtterance(text);
 msg.lang='id-ID'; msg.rate=rateV; msg.pitch=pitchV;
 let voices=speechSynthesis.getVoices();
 let female=voices.find(v=>v.name.toLowerCase().includes('female')) || voices.find(v=>v.lang.includes('id')) || voices[1] || voices[0];
 if(female) msg.voice=female;
 // bass effect
 if(bassV>50){let c=getCtx(); let o=c.createOscillator(),g=c.createGain(); o.frequency.value=70; g.gain.setValueAtTime(bassV/500,c.currentTime); g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.5); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.5);}
 speechSynthesis.speak(msg);
}
function playMCFunkot(){
 playMC();
 setTimeout(()=>{
  let c=getCtx();
  function kick(a){let o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,a);o.frequency.exponentialRampToValueAtTime(35,a+0.22);g.gain.setValueAtTime(1,a);g.gain.exponentialRampToValueAtTime(0.01,a+0.5);o.connect(g);g.connect(c.destination);o.start(a);o.stop(a+0.6);}
  let t=c.currentTime+0.2; for(let i=0;i<16;i++) kick(t+i*(60/155));
 },4000);
}
speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices();};
</script>
</body>
</html>
