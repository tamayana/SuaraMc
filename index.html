<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DJ RAHMAD PRATAMA MIX - BLACK RED</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;display:flex;justify-content:center;align-items:center;padding:6px;font-family:system-ui}
.card{width:100%;max-width:390px;background:linear-gradient(180deg,#0a0a0a,#000);border:2px solid #ff0000;border-radius:16px;padding:10px;box-shadow:0 0 30px #ff000055, inset 0 0 20px #ff000022}
h1{margin:0;text-align:center;color:#ff0000;text-shadow:0 0 12px #ff0000, 0 0 25px #ff0000;font-size:22px;line-height:1;letter-spacing:1px}
.sub{text-align:center;color:#888;font-size:9px;letter-spacing:3px;margin:4px 0 6px}
.photo-wrap{position:relative;width:100%;height:320px;border-radius:12px;overflow:hidden;border:2px solid #ff0000;background:#000;box-shadow:0 0 15px #ff000044}
.photo-wrap .bg-blur{position:absolute;inset:0;background:url('foto-rahmad.jpg') center/cover;filter:blur(20px) brightness(0.4) sepia(1) hue-rotate(-50deg) saturate(3)}
.photo-wrap img{position:relative;width:100%;height:100%;object-fit:contain;z-index:1;filter:contrast(1.1) brightness(0.95)}
input,textarea{width:100%;padding:10px;background:#0a0a0a;border:1px solid #ff0000;border-radius:8px;color:#fff;font-size:13px;margin:5px 0;outline:none}
input:focus,textarea:focus{border-color:#ff0000;box-shadow:0 0 10px #ff000055}
textarea{height:72px;resize:none;line-height:1.3}
label{font-size:10px;color:#888;display:flex;justify-content:space-between;margin-top:4px}
input[type=range]{width:100%;accent-color:#ff0000;height:12px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctrl{background:#111;border:1px solid #2a0000;border-radius:8px;padding:6px}
.preset{display:flex;gap:4px;margin:6px 0}
.preset button{flex:1;padding:7px;font-size:9px;border-radius:6px;border:1px solid #ff0000;background:#000;color:#ff0000;font-weight:700}
.preset button.active{background:#ff0000;color:#000;box-shadow:0 0 12px #ff0000}
.knobs{display:flex;gap:6px;margin:6px 0}
.knob{flex:1;background:#0f0f0f;border:1px solid #330000;border-radius:8px;padding:5px;text-align:center}
.knob span{font-size:8px;color:#ff0000}
button.main{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:12px;margin-top:6px;letter-spacing:1px}
.blackred{background:linear-gradient(180deg,#ff0000,#8b0000);color:#fff;box-shadow:0 0 15px #ff000055}
.darkred{background:linear-gradient(180deg,#1a0000,#000);color:#ff0000;border:1.5px solid #ff0000}
#out{background:#050000;border:1px solid #330000;border-radius:8px;padding:8px;margin-top:6px;text-align:center;font-size:11px;color:#ff0000;min-height:36px}
</style>
</head>
<body>
<div class="card">
<h1>DJ RAHMAD<br>PRATAMA MIX</h1>
<div class="sub">• MC CEWEK • LIVE • BLACK RED •</div>

<div class="photo-wrap">
<div class="bg-blur"></div>
<img src="foto-rahmad.jpg" alt="DJ">
</div>

<input type="text" id="nama" value="Rahmad Pratama" placeholder="Nama yang request">
<textarea id="kata" placeholder="Ketik kata-kata MC...">Spesial request, balee kancai kenak die, DJ Rahmad Pratama Mix, yang punya kawasan!</textarea>

<div class="preset">
<button id="p1" onclick="setPreset('holy')">HOLYWINGS</button>
<button id="p2" class="active" onclick="setPreset('funkot')">FUNKOT</button>
<button id="p3" onclick="setPreset('break')">BREAKBEAT</button>
</div>

<div class="ctrls">
<div class="ctrl"><label>Speed <span id="rv">0.90</span></label><input type="range" id="rate" min="0.5" max="1.3" step="0.05" value="0.90" oninput="rv.innerText=this.value"></div>
<div class="ctrl"><label>Manja <span id="pv">1.20</span></label><input type="range" id="pitch" min="0.7" max="1.6" step="0.05" value="1.20" oninput="pv.innerText=this.value"></div>
</div>

<div class="knobs">
<div class="knob"><span>BASS</span><input type="range" id="bass" min="0" max="100" value="70"><span id="bv">70%</span></div>
<div class="knob"><span>MID</span><input type="range" id="mid" min="0" max="100" value="55"><span id="mv">55%</span></div>
<div class="knob"><span>TREBLE</span><input type="range" id="treb" min="0" max="100" value="80"><span id="tv">80%</span></div>
</div>

<button class="main blackred" onclick="playMC()">🎙️ PLAY MC CEWEK</button>
<button class="main darkred" onclick="playMCFunkot()">🔥 PLAY + FUNKOT DROP</button>

<div id="out">Spesial request RAHMAD PRATAMA - BLACK RED MODE</div>
</div>

<script>
function setPreset(t){
 document.querySelectorAll('.preset button').forEach(b=>b.classList.remove('active'));
 if(t=='holy'){p1.classList.add('active'); rate.value=0.80; pitch.value=1.10; kata.value="Spesial request, "+nama.value+", santai dulu bosku, DJ Rahmad Pratama Mix!";}
 if(t=='funkot'){p2.classList.add('active'); rate.value=0.90; pitch.value=1.25; kata.value="Spesial request, "+nama.value+", balee kancai kenak die, DJ Rahmad Pratama Mix, yang punya kawasan!";}
 if(t=='break'){p3.classList.add('active'); rate.value=0.95; pitch.value=1.15; kata.value="Yo "+nama.value+" di area, breakbeat time, DJ Rahmad Pratama Mix!";}
 rv.innerText=rate.value; pv.innerText=pitch.value;
}
bass.oninput=()=>bv.innerText=bass.value+'%'; mid.oninput=()=>mv.innerText=mid.value+'%'; treb.oninput=()=>tv.innerText=treb.value+'%';
let ctx=null;
function getCtx(){if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)(); return ctx;}
function playMC(){
 let kataText=document.getElementById('kata').value.trim()||'Spesial request';
 let rateV=parseFloat(rate.value); let pitchV=parseFloat(pitch.value);
 document.getElementById('out').innerHTML=`<b style="color:#fff">${kataText.toUpperCase()}</b>`;
 speechSynthesis.cancel();
 let msg=new SpeechSynthesisUtterance(kataText);
 msg.lang='id-ID'; msg.rate=rateV; msg.pitch=pitchV;
 let voices=speechSynthesis.getVoices();
 let female=voices.find(v=>v.name.toLowerCase().includes('female')) || voices.find(v=>v.lang.includes('id')) || voices[1] || voices[0];
 if(female) msg.voice=female;
 speechSynthesis.speak(msg);
}
function playMCFunkot(){
 playMC();
 setTimeout(()=>{
  let c=getCtx();
  function kick(a){let o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(160,a);o.frequency.exponentialRampToValueAtTime(32,a+0.25);g.gain.setValueAtTime(1,a);g.gain.exponentialRampToValueAtTime(0.01,a+0.55);o.connect(g);g.connect(c.destination);o.start(a);o.stop(a+0.6);}
  let t=c.currentTime+0.2; for(let i=0;i<16;i++) kick(t+i*(60/150));
 },3800);
}
speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices();};
</script>
</body>
</html>
