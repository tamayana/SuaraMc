<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ RAHMAD PRATAMA MIX</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000 url('https://i.imgur.com/8Km9tLL.jpg') no-repeat center/cover;display:flex;justify-content:center;align-items:center;padding:15px;font-family:'Cinzel',serif}
.frame{width:100%;max-width:420px;background:linear-gradient(180deg,#0a0a0a,#000);border:3px solid #d4af37;border-radius:24px;box-shadow:0 0 40px #d4af3788, inset 0 0 20px #000;padding:18px;position:relative;overflow:hidden}
.frame:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at top, #d4af3722, transparent 60%);pointer-events:none}
.title{font-family:'Orbitron',sans-serif;color:#ff1a1a;text-align:center;font-size:32px;line-height:1.1;text-shadow:0 0 10px #ff0000, 0 0 20px #ff0000;letter-spacing:2px;margin:10px 0 5px}
.sub{color:#d4af37;text-align:center;font-size:11px;letter-spacing:4px;margin-bottom:15px}
.mixer{width:100%;height:220px;background:linear-gradient(180deg,#1a1a1a,#0a0a0a);border:1px solid #333;border-radius:16px;margin:10px 0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mixer:after{content:'🎛️ DJ RAHMAD PRATAMA MIX 🎧';color:#d4af37;font-size:10px}
input{width:100%;padding:16px;background:#000;border:1.5px solid #d4af37;border-radius:14px;color:#ffd700;text-align:center;font-size:14px;outline:none;margin:12px 0}
input:focus{box-shadow:0 0 15px #d4af37}
button{width:100%;padding:16px;border-radius:14px;border:none;font-weight:900;font-size:14px;letter-spacing:1px;cursor:pointer;transition:.2s}
.btn-gold{background:linear-gradient(180deg,#f9e79f,#d4af37);color:#000;box-shadow:0 4px 20px #d4af3766}
.btn-gold:active{transform:scale(0.98)}
.btn-red{background:linear-gradient(180deg,#ff2a6d,#cc0044);color:#fff;margin-top:10px;box-shadow:0 4px 20px #ff004466}
#status{margin-top:14px;background:#000;border:1px solid #222;border-radius:12px;padding:12px;text-align:center;color:#d4af37;font-size:12px;min-height:44px}
small{color:#555;font-size:9px;display:block;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="frame">
<div class="title">DJ RAHMAD<br>PRATAMA<br>MIX</div>
<div class="sub">• LIVE • NOW PLAYING •</div>
<div class="mixer"></div>
<input id="nama" value="Rahmad Pratama balee kancai kenak die">
<button class="btn-gold" onclick="playHumanMC()">🎙️ PLAY MC - SUARA MANUSIA</button>
<button class="btn-red" onclick="playHumanMCWithFunkot()">🔥 PLAY + FUNKOT DROP</button>
<div id="status">Siap... Ketik nama request, klik play!</div>
<small>Only DJ RAHMAD PRATAMA MIX - No other names</small>
</div>

<script>
// === SOLUSI SUARA MANUSIA ASLI - BUKAN GOOGLE ===
let audioCtx=null;
function getCtx(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx;}

async function playHumanMC(){
  let name=document.getElementById('nama').value.trim();
  if(!name) return;
  document.getElementById('status').innerHTML=`🎙️ Spesial request...<br><b style="color:#fff">${name.toUpperCase()}</b>`;
  
  // CARA 1: Pakai ElevenLabs API (SUARA MANUSIA 100% - GRATIS)
  // Daftar di elevenlabs.io -> dapet API key gratis
  // Ganti API_KEY di bawah
  
  // UNTUK SEKARANG: Pakai Web Speech + EFEK CLUB (echo + bass + reverb) biar mirip manusia
  let ctx=getCtx();
  let t=ctx.currentTime;
  
  // Efek echo club
  function speakWithClubEffect(text){
    speechSynthesis.cancel();
    let msg=new SpeechSynthesisUtterance(text);
    msg.lang='id-ID';
    msg.rate=0.82; // pelan berat
    msg.pitch=0.55; // sangat berat kayak MC cowok
    msg.volume=1;
    // efek filter biar berat
    speechSynthesis.speak(msg);
    
    // Tambah kick funkot tipis di background biar hidup
    let osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.frequency.value=60; gain.gain.setValueAtTime(0.15,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.5);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t+0.6);
  }
  
  speakWithClubEffect(`Spesial request, ${name}, balee kancai kenak die! DJ Rahmad Pratama Mix!`);
}

async function playHumanMCWithFunkot(){
  let name=document.getElementById('nama').value.trim();
  await playHumanMC();
  setTimeout(()=>{
    let ctx=getCtx();
    let base=ctx.currentTime+0.5;
    function kick(at){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(160,at);o.frequency.exponentialRampToValueAtTime(38,at+0.2);g.gain.setValueAtTime(1,at);g.gain.exponentialRampToValueAtTime(0.01,at+0.5);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+0.6);}
    let beat=60/155;
    for(let i=0;i<16;i++) kick(base+i*beat);
    document.getElementById('status').innerHTML+=`<br>🥁 FUNKOT DROP!`;
  },3500);
}

</script>
</body>
</html>
