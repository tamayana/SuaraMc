<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DJ RAHMAD PRATAMA MIX</title>
<style>
body{margin:0;min-height:100vh;background:#000 url('foto-rahmad.jpg') no-repeat center/cover;display:flex;justify-content:center;align-items:center;padding:12px}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(180deg,#00000088,#ff4da644);backdrop-filter:blur(2px)}
.card{position:relative;width:100%;max-width:380px;background:linear-gradient(180deg,#000000ee,#1a0011ee);border:2px solid #ff4da6;border-radius:22px;padding:18px;box-shadow:0 0 40px #ff4da6aa}
h1{margin:0;text-align:center;color:#ff4da6;text-shadow:0 0 15px #ff4da6;font-size:28px;line-height:1}
.sub{text-align:center;color:#d4af37;font-size:10px;letter-spacing:4px;margin:8px 0}
.photo{width:100%;height:220px;border-radius:14px;overflow:hidden;border:1.5px solid #ff4da6;margin:10px 0;background:url('foto-rahmad.jpg') center/cover}
input{width:100%;padding:14px;background:#000;border:1.5px solid #ff4da6;border-radius:12px;color:#fff;text-align:center}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px}
.pink{background:linear-gradient(#ffb3d9,#ff4da6)}
.red{background:#ff0040;color:#fff}
#out{background:#000;border:1px solid #222;border-radius:10px;padding:10px;margin-top:10px;text-align:center;color:#ff4da6;font-size:12px}
label{font-size:11px;color:#aaa;display:block;margin-top:8px}
input[type=range]{width:100%;accent-color:#ff4da6}
</style>
</head>
<body>
<div class="card">
<h1>DJ RAHMAD<br>PRATAMA MIX</h1>
<div class="sub">• MC CEWEK • LIVE •</div>
<div class="photo"></div>
<input id="nama" value="Rahmad Pratama">

<label>Kecepatan Cewek: <span id="rv">0.90</span></label>
<input type="range" id="rate" min="0.7" max="1.2" step="0.05" value="0.90" oninput="rv.innerText=this.value">
<label>Manja: <span id="pv">1.20</span></label>
<input type="range" id="pitch" min="0.9" max="1.6" step="0.05" value="1.20" oninput="pv.innerText=this.value">

<button class="pink" onclick="playMC()">🎙️ PLAY MC CEWEK</button>
<button class="red" onclick="playMCFunkot()">🔥 PLAY + FUNKOT</button>
<div id="out">Siap...</div>
</div>
<script>
function playMC(){
 let name=document.getElementById('nama').value.trim()||'Rahmad Pratama';
 let rate=parseFloat(document.getElementById('rate').value);
 let pitch=parseFloat(document.getElementById('pitch').value);
 document.getElementById('out').innerHTML=`🎙️ Spesial request<br><b style="color:#fff">${name.toUpperCase()}</b>`;
 speechSynthesis.cancel();
 let text=`Spesial request, ${name}, balee kancai kenak die, DJ Rahmad Pratama Mix!`;
 let msg=new SpeechSynthesisUtterance(text);
 msg.lang='id-ID'; msg.rate=rate; msg.pitch=pitch;
 // paksa cewek
 let voices=speechSynthesis.getVoices();
 let female=voices.find(v=>v.name.toLowerCase().includes('female')) || voices.find(v=>v.lang.includes('id')) || voices[1] || voices[0];
 if(female) msg.voice=female;
 speechSynthesis.speak(msg);
}
function playMCFunkot(){
 playMC();
 setTimeout(()=>{
  let ctx=new(window.AudioContext||window.webkitAudioContext)();
  function kick(a){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,a);o.frequency.exponentialRampToValueAtTime(35,a+0.2);g.gain.setValueAtTime(1,a);g.gain.exponentialRampToValueAtTime(0.01,a+0.4);o.connect(g);g.connect(ctx.destination);o.start(a);o.stop(a+0.5);}
  let t=ctx.currentTime+0.2; for(let i=0;i<16;i++) kick(t+i*(60/155));
 },4000);
}
speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices();}
</script>
</body>
</html>
